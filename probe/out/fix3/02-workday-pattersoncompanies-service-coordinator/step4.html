    <meta name="description" property="og:description" content="Patterson isn't just a place to work, it's a partner that cares about your success. One of the distinguishing marks of our company is the talented people who embrace the people-first, always advancing, and results-driven culture. Professional growth abounds in this motivating environment. We value the diverse talents and experiences our employees bring to Patterson and believe that they build a stronger and successful organization. Job Summary As a TechEdge Service Coordinator for Patterson Dental, you will be responsible for providing a professional approach to dispatching and performing all duties related to the scheduling of requests for service. The service coordinator role requires a high level of professional autonomy due to the nature of resource planning in assignment of service technicians to service requests. Essential Functions Triages calls and inquiries from customers. Assigns and schedules service requests from clients or company personnel. Manages resources efficiently and effectively for all scheduled service. Monitors service orders assigned to technicians. Responsible for the life cycle of service order (creates, edits, completes and invoice service orders). Reconciles various CRM reports on a monthly basis. Works closely with the Branch Procurement Specialist(s) with resource and project planning. Demonstrates a commitment to Patterson values &amp;amp; professionalism through appropriate conduct at all times. Performs other service coordinator duties as assigned. Job Qualifications Minimum Qualifications: Associates degree or higher preferred or 2-5 years equivalent industry experience. Expresses strong customer service orientation or related dispatching experience through excellent written and verbal/phone communication skills. Has strong organizational and multi-tasking skills, demonstrates sound judgment and excellent decision-making abilities, and shows a great attention to detail. Ability to positively contribute to the Branch team environment by taking initiative to learn and improve upon skillsets. Possesses strong planning and organizational skills, both written and verbal. Uses technology with efficiency, including Microsoft 365 and SAP CRM platforms. Preferred Qualifications: 1-3 years dispatching and customer service experience, with previous experience in the Dental industry preferred. Previous working experience with project or resource coordination. Bookkeeping/accounting experience preferred. What's In It For You: We provide competitive benefits, unique incentive programs and rewards for our eligible employees: Full Medical, Dental, and Vision benefits and an integrated Wellness Program 401(k) Match Retirement Savings Plan Paid Time Off (PTO) Holiday Pay &amp;amp; Floating Holidays Volunteer Time Off (VTO) Educational Assistance Program Full Paid Parental and Adoption Leave LifeWorks (Employee Assistance Program) Patterson Perks Program The potential compensation range for this role is below. The final offer amount could exceed this range, based on various factors such as candidate location (geographical labor market), experience, and skills. $25.05 - $32.55 EEO Statement Patterson provides equal employment opportunities to applicants and employees without regard to race; color; sex; gender identity; sexual orientation; religious practices and observances; national origin; pregnancy, childbirth, or other related medical conditions; status as a protected veteran or spouse/family member of a protected veteran; or disability. At Patterson Companies, we live our values everyday. With more than 8,000 employees worldwide, we're responsible for providing dentists, veterinarians, animal producers, and farmers with the support they need to keep us and our animals healthy.">
