    <meta name="description" property="og:description" content="Multi Asset Analyst – Multi Asset, New York, NY PineBridge Investments, A MetLife Investment Management company. MetLife Investment Management (MIM) has successfully acquired PineBridge as of December 30, 2025. MetLife Investment Management and PineBridge Investments now have more to offer; broader reach, deeper insights and specialized capabilities – forming a top-tier global investment platform. Together, we have more than $700 billion in assets under management as of March 2026 and aim to deliver consistent risk-adjusted returns. From multi-asset, equities, and fixed income to private credit and real estate, we offer specialized capabilities backed by a broader global reach and regionally grounded insights tailored to investor needs. What sets us apart isn’t just the breadth of our platform and capabilities — it’s how we partner. Across both firms, we share a strong investment culture that prioritizes partnership, transparency, and accountability. We believe that our clients benefit from direct access to decision-makers and reinforced by a culture that views decisions through the client’s perspective. Join us and experience the excitement of working with the brightest minds in the industry, shaping the future of asset management. The role will be based in New York, NY with the expectation of a hybrid work model. The PineBridge Global Multi-Asset Team is seeking a Multi-Asset Analyst to support portfolio implementation and execution across a diverse set of strategies. This individual will play a key role in translating investment views into actionable trades, monitoring portfolio positioning and risk, and partnering closely with portfolio managers and cross-functional teams. The role offers hands-on exposure to multi-asset investing, combining quantitative analysis, market insight, and operational execution, with a clear path toward developing into a Portfolio Manager. Primary Responsibilities: Serve as an active member of the Global Multi-Asset team with a focus on portfolio implementation and execution Support Portfolio Managers in order generation, trade execution workflows, and day-to-day portfolio management activities Monitor portfolios on an ongoing basis, including performance tracking, risk exposure analysis, and liquidity/cash management Analyze and report on portfolio positioning, providing insights to support investment decision-making Contribute to the development and enhancement of portfolio construction frameworks, risk analytics, and trading tools Partner cross-functionally with traders, operations, compliance, risk, and middle office teams to ensure efficient portfolio execution and oversight Collaborate with investment specialists across asset classes including equities, fixed income, and alternatives Perform ad hoc quantitative analysis and data-driven projects to support team initiatives and strategic decisions Qualifications: Bachelor’s degree in a quantitative or analytical discipline such as Mathematics, Statistics, Computer Science, Econometrics, or Finance 0–2 years of relevant experience, including internships or full-time roles in asset management, trading, risk, operations, or investment analytics Programming experience in Python, R, or a similar language required Demonstrated interest in financial markets and multi-asset investing, with strong intellectual curiosity High attention to detail and commitment to accuracy in a fast-paced environment Proven ability to collaborate effectively within a team-oriented setting Strong analytical and problem-solving skills with the ability to handle complex data sets Preferred Qualifications: Proficiency in Microsoft Excel, including data analysis, financial modeling, and reporting (required unless offset by advanced programming expertise) Progress toward or interest in CFA or FRM designation Familiarity with investment management systems (e.g., Aladdin) and/or emerging technologies such as AI tools About PineBridge PineBridge is proud of our award-winning culture, which reflects our commitment to empowering employees and fostering a collaborative work environment. For six consecutive years (2020-2025), PineBridge has been named a ‘Best Place to Work in Money Management’ by Pensions &amp;amp; Investments, a leading industry designation which recognizes the best employers in the asset management industry by evaluating employer benefits, policies, and responses to an employee survey. In 2023, PineBridge received Hong Kong Institute for HR Management Elite awards for ‘Best Workplace’ and ‘Learning &amp;amp; Development’ and in 2024 we received Merit awards for ‘Talent Acquisition’ and ‘Employee Benefits.’ Alongside this, in 2023 and 2024 PineBridge was recognized as a finalist at the 100 Women in Finance’s APAC Industry Diversity, Equity &amp;amp; Inclusion Award. Our benefits: We offer a wide range of family friendly benefits including comprehensive healthcare, back-up childcare program to support working parents and flexible work arrangements so you can be there for the people you care about. We also provide a competitive retirement plan and tuition reimbursement. Furthermore, we have a robust list of professional development opportunities with the goal of engaging, retaining, and developing our talent. Our values: We value our clients, investment excellence, collaboration with our distributed team members, empowerment, and independence as we honor our heritage and our roots. *Salary Range: $ 100K – 110K annually + bonus + benefits *The above represents the expected salary range for this job requisition. Ultimately, in determining your pay, we’ll consider your location, experience, and other job-related factors. PineBridge is proud to be an Equal Opportunity Employer committed to fostering an inclusive workplace, providing opportunities for all qualified persons and maintaining an environment free from all forms of harassment and discrimination for its employees. PineBridge is dedicated to recruiting, hiring, training and promoting into all job levels the most qualified applicants without regard to actual or perceived age, race, creed, color, religion, national origin, ancestry, height, weight, sex, gender (including gender identity), disability, pregnancy, marital status, domestic partner status, sexual orientation, AIDS/HIV status, military status, alienage or citizenship status, genetic information, domestic violence victim status or any other basis protected by applicable federal, state or local laws. At PineBridge, we strive to create an inclusive environment that attracts, retains, and develops the best global talent, leveraging the unique backgrounds, skills, and perspectives that all our people bring to work. #LI-hybrid Instances of Fraudulent Job Offers It has recently been brought to our attention that there have been instances of fraudulent job offers, purporting to be from PineBridge Investments or its affiliate companies. The individuals or organizations sending these false employment offers may pose as a PineBridge recruiter or human resources representative and request personal information, purchasing of equipment or funds to further the recruitment process. They may even provide documentation in furtherance of their fraudulent attempts. How to Identify if the Offer Received Was Made by PineBridge: Here are a few ways to identify whether the offer you may have received is from PineBridge Investments: PineBridge applicants are required to apply via our official company and affiliate country websites (career site or campus site). Any request to apply to a job that does not lead back to one of these sites is likely to be fraudulent. Hiring process related travel will be booked through our travel agency at our expense and at our direction. If you are being asked to pay to book travel as a part of an interview process, it is likely to be fraudulent. PineBridge only utilizes PineBridge.com domains for email accounts (example@PineBridge.com). Any contact by an email that does not use exactly that domain is likely fraudulent. During the selection process we will require one or more interviews that are conducted either face-to-face or virtually with employees of the company. Any offer of employment that is unsolicited or does not involve an interview process is likely fraudulent. PineBridge does not ask the applicant for information related to bank accounts, credit cards, or other financial accounts prior to a signed, official offer letter of employment. If you are being asked for this information earlier in the process, it is likely a fraudulent request. How to Report a Fraudulent Offer: You may report any such behavior via recruiting@pinebridge.com. If you have been defrauded or suspect identify theft as a result of an employment scam, please contact your local law enforcement agency for guidance. About PineBridge Investments: PineBridge Investments is a private, global asset manager focused on active, high conviction investing. We draw on the collective power of our experts in each discipline, market, and region of the world through an open culture of collaboration designed to identify the best ideas. Our mission is to exceed clients’ expectations on every level, every day. As of 31 December 2024, the firm managed US$190.3 billion across global asset classes for sophisticated investors around the world. For five consecutive years (2020-2024), PineBridge has been named a ‘Best Place to Work in Money Management’ by Pensions &amp;amp; Investments, a leading industry designation which recognizes the best employers in the asset management industry by evaluating employer benefits, policies, and responses to an employee survey. PineBridge is proud to be an Equal Opportunity Employer committed to diversifying its workforce, providing equal employment opportunity for all qualified persons and maintaining an environment free from all forms of harassment and discrimination for its employees. PineBridge is dedicated to recruiting, hiring, training and promoting into all job levels the most qualified applicants without regard to actual or perceived age, race, creed, color, religion, national origin, ancestry, height, weight, sex, gender (including gender identity), disability, pregnancy, marital status, domestic partner status, sexual orientation, AIDS/HIV status, military status, alienage or citizenship status, genetic information, domestic violence victim status or any other basis protected by applicable federal, state or local laws. At PineBridge, we strive to create an inclusive environment that attracts, retains, and develops the best global talent, leveraging the unique backgrounds, talents, and perspectives that all our people bring to work.">
