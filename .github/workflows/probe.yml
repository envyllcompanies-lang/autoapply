name: probe

# Test runs: open real application forms, fill them, never submit. Started by pushing probe/request.yaml on the 'probe' branch.
on:
  push:
    branches: [probe]
    paths: ["probe/request.yaml"]

permissions:
  contents: write

concurrency:
  group: autoapply         # never at the same time as a real run
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt pillow
          python -m playwright install --with-deps chromium

      - name: Write private config from secrets
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          ABOUT_ME_MD: ${{ secrets.ABOUT_ME_MD }}
          VOICE_MD: ${{ secrets.VOICE_MD }}
        run: |
          printf '%s' "$CONFIG_YAML" > config.yaml
          printf '%s' "$PROFILE_YAML" > profile.yaml
          printf '%s' "$ABOUT_ME_MD" > about_me.md
          if [ -n "$VOICE_MD" ]; then printf '%s' "$VOICE_MD" > voice.md; fi

      - name: Fetch the latest history from main (read only)
        run: |
          git fetch --depth 1 origin main
          git show origin/main:applications.db > applications.db || true
          git show origin/main:accounts.json > accounts.json 2>/dev/null || true

      - name: Probe
        timeout-minutes: 50
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
        run: python -m autoapply.probe

      - name: Save probe results to the probe branch
        if: always()
        run: |
          git config user.name "autoapply-bot"
          git config user.email "autoapply-bot@users.noreply.github.com"
          rm -rf /tmp/pout && cp -r probe/out /tmp/pout 2>/dev/null || exit 0
          for i in 1 2 3 4; do
            git fetch origin probe && git reset --hard origin/probe
            mkdir -p probe/out && cp -r /tmp/pout/. probe/out/
            git add -f probe/out
            git diff --cached --quiet && exit 0
            git commit -qm "probe results" && git push origin HEAD:probe && exit 0
            sleep $((i * 4))
          done
