name: autoapply

on:
  schedule:
    # Four runs a day, spaced across the US working day (UTC): 9am ET, 1pm ET, 5pm ET, 9pm ET.
    # Free private-repo Actions minutes are 2,000 a month; the bot budgets its own run time against that (see README).
    - cron: "7 1,13,17,21 * * *"
    # Every 15 minutes, used ONLY while the repository is public (public repositories have no minutes limit): together with
    # 50-minute runs that is non-stop, and a broken chain is picked up again within about 15 minutes (GitHub's schedule often
    # fires late). Runs never overlap (see 'concurrency'), so an extra start while one is running just waits or is dropped.
    # While the repository is private these starts are skipped and cost nothing.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fill forms but don't submit"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write            # lets a finished run start the next one (non-stop mode)

concurrency:
  group: autoapply         # never two runs at once
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name != 'schedule' || github.event.schedule == '7 1,13,17,21 * * *' || github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Note the start time
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Write private config from secrets
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          ABOUT_ME_MD: ${{ secrets.ABOUT_ME_MD }}
          VOICE_MD: ${{ secrets.VOICE_MD }}
        run: |
          printf '%s' "$CONFIG_YAML" > config.yaml
          printf '%s' "$PROFILE_YAML" > profile.yaml
          printf '%s' "$ABOUT_ME_MD" > about_me.md
          if [ -n "$VOICE_MD" ]; then printf '%s' "$VOICE_MD" > voice.md; fi

      - name: Compile preflight
        run: python -m compileall -q autoapply tests

      - name: Run
        timeout-minutes: 68
        env:
          AUTOAPPLY_UNLIMITED: ${{ github.event.repository.visibility == 'public' && '1' || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
        run: python -m autoapply ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save history (so nothing is ever applied to twice)
        if: always()
        run: |
          git config user.name "autoapply-bot"
          git config user.email "autoapply-bot@users.noreply.github.com"
          # Only the small files that are the bot's memory. (Fetched job feeds under logs/agg_cache are not kept.)
          HIST="applications.db discovered_boards.json boards_state.json accounts.json reports logs/usage_minutes.json logs/usage.json"
          rm -rf /tmp/hist && mkdir -p /tmp/hist
          for f in $HIST; do
            if [ -e "$f" ]; then mkdir -p "/tmp/hist/$(dirname "$f")"; cp -r "$f" "/tmp/hist/$f"; fi
          done
          mkdir -p /tmp/hist/logs && cp logs/*.log /tmp/hist/logs/ 2>/dev/null || true
          for i in 1 2 3 4 5 6; do
            git fetch origin main && git reset --hard origin/main
            cp -r /tmp/hist/. .
            ADD=""
            for f in $HIST logs/*.log; do [ -e "$f" ] && ADD="$ADD $f"; done      # git add fails wholesale on a missing path
            [ -n "$ADD" ] && git add -f $ADD
            git diff --cached --quiet && { echo "nothing new to save"; exit 0; }
            git commit -qm "autoapply run $(date -u +%F)" && git push origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          echo "::error::could not save applications.db (history)"; exit 1

      - name: Upload résumés, cover letters and form screenshots
        # never from a public repository: anyone could download the filled-in forms (address, phone, answers)
        if: always() && github.event.repository.visibility != 'public'
        uses: actions/upload-artifact@v4
        with:
          name: applications-${{ github.run_id }}
          path: applications/
          retention-days: 30
          if-no-files-found: ignore

      # Non-stop mode (public repository only): GitHub's own schedule often fires hours late, so each run starts the next
      # one itself when it ends. Runs never overlap (see 'concurrency'). A run that had little to do waits out the rest
      # of 25 minutes first, so job sites are not asked the same thing every two minutes. To stop the chain, disable the
      # workflow (Actions -> autoapply -> Disable workflow).
      - name: Start the next run
        if: always() && github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 1500 - ($(date +%s) - ${T0:-0}) ))
          if [ "$left" -gt 0 ] && [ "$left" -lt 1500 ]; then sleep "$left"; fi
          gh workflow run autoapply.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "could not start the next run (the hourly schedule will)"
