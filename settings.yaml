# Non-private settings kept in the repository and merged over your private config.yaml (which lives in GitHub secrets).
# Sections merge; a list or a single value here replaces the one in config.yaml.

search:
  skip_sources: []            # no job source is skipped
  skip_sites: []              # no application system is skipped: they are tried in the order of what has actually been
                              # going through lately (Workday first; sites that keep ending at a human check last)
  discover_every_hours: 20    # search for new jobs about once a day; the other runs spend all their time applying
  min_score: 10               # keyword score needed to be a candidate at all. Low on purpose (was 35 until 2026-10-06): the
                              # keyword score turned out to say little about the real match (postings scoring 30-39 passed the
                              # résumé check as often as those scoring 60-79), so it only removes postings with nothing going
                              # for them. The résumé check below decides, and the candidates are checked best prospects first.
  prescreen: true             # right before applying, each job is checked against your résumé (like LinkedIn's match score)
  min_fit: 55                 # ...and only jobs with a match of 55% or more are applied to (70 until 2026-10-03, 60 until 2026-10-08)
  min_score_without_match: 90 # when the free match check has no allowance left: only jobs whose keyword score is this high go
                              # ahead without it, the rest wait for a later run (they are not dropped). Kept high because the
                              # allowance now runs out every day by design, and unchecked jobs should not slip through then.
  daily_cap_unlimited: 500    # most applications in one day while the bot runs non-stop (300 until 2026-10-08): with thousands of candidates
                              # the limit should be the résumé check, not this number
  max_per_company: 0          # no limit on applications to one employer: every role that passes your résumé match goes
  max_checks_per_company_per_run: 6     # résumé checks spent on one employer per run, so one big employer cannot use them all
  max_human_check_tries_per_day: 3      # tries per day on sites where every recent try ended at a human check (CAPTCHA);
                                        # their other good matches go to your apply-by-hand list
  max_level: 1                # 0 = entry only, 1 = entry + early career (up to 2 required years). Mid/senior are skipped.
  exclude_government: true    # federal, state, county, city and public-agency employers are dropped, whatever source they come from
  titles_include_add:         # added to your private list of accepted titles (not replacing it): entry roles an Industrial &
    - manufacturing engineer  # Systems Engineering graduate with construction-finance and operations work is hired for
    - project engineer
    - field engineer
    - site engineer
    - lean engineer
    - value stream engineer
    - cost engineer
    - estimating engineer
    - scheduling engineer
    - material handling engineer
    - warehouse engineer
    - project accountant
    # (2026-10-25) operations-side roles an ISE graduate with SOP, scheduling and vendor work fits; the résumé match
    # (55%) still decides each one
    - quality engineer
    - quality analyst
    - quality specialist
    - process improvement
    - continuous improvement
    - implementation specialist
    - implementation analyst
    - implementation associate
    - customer success
    - client success
    - onboarding specialist
    - revenue operations
    - sales operations
    - account coordinator
    - deployment strategist
    # (2026-10-27, 'more jobs in general') families your list did not include and does not exclude; sales development
    # and account executive stay out (your private exclude list names them). The résumé match still decides each job.
    - recruiter
    - recruiting
    - talent acquisition
    - human resources
    - hr generalist
    - hr assistant
    - people operations
    - executive assistant
    - administrative assistant
    - office assistant
    - accountant
    - accounts payable
    - accounts receivable
    - field service engineer

# A cover letter only where the form requires one (true: on every form that has a cover-letter box; false: never,
# and a form that requires one is skipped). Overrides config.yaml.
cover_letters: required

scoring:
  location_tiers:           # keyword-score points by place, highest that applies (they also move a job up the queue).
    glenwood springs: 12    # home area, Rifle to Carbondale (I-70 / Highway 82): same as New York / Denver
    glenwood spgs: 12
    rifle: 12
    silt, co: 12            # 'silt, co' / 'new castle, co' / 'carbondale, co' also match '…, Colorado' but not New Castle, DE or Carbondale, IL
    new castle, co: 12
    carbondale, co: 12
    parachute, co: 12
    battlement mesa: 12
    basalt: 12
    el jebel: 12
    garfield county: 12
    roaring fork: 12
    remote: 16             # 'remote' includes postings whose description says they are remote in the US
    new york: 12            # (also 'NY' towns: Brooklyn, Rye Brook, Long Island City…)
    nyc: 12
    denver: 12
    colorado: 12            # Denver suburbs (Westminster, Aurora, Lakewood…) read as Colorado
    los angeles: 6          # considered, but after the three above
    santa monica: 6
    culver city: 6
    el segundo: 6
    long beach: 6
    pasadena: 6
    burbank: 6
    glendale: 6
    torrance: 6
  pay_min_ceiling: 100000   # a posting whose pay STARTS at $100K+ is not entry level

writer:
  # Groq's free models, best first. Each has its own daily allowance, so when one runs out the next takes over.
  # A model Groq no longer offers is skipped automatically after one try.
  #
  # Two things use the free allowance: the résumé-match check of every candidate, and the answers on each application.
  # On 2026-10-07 the answers ran out by early morning (Groq counts tokens, and every answer carries your background),
  # and every application after that stopped at its first written question. So:
  #   * gemini-lite ('match_first') does the match checks first: Google counts requests, not tokens, and five postings
  #     go into one request. At most match_share of its day goes to match checks; with the rest it writes answers, but
  #     only when the Groq models have nothing left for the day (it is last in line for answers);
  #   * the Groq models are for your answers: groq (the best) only writes answers, the two smaller ones give at most a
  #     quarter of their day to match checks, and only when Gemini cannot take them;
  #   * providers marked 'role: match' do nothing but match checks.
  # When no model has allowance left for an answer, a job that needs one is not thrown away: it stays queued.
  # The Gemini entries need a valid GEMINI_API_KEY secret (free at aistudio.google.com); a key Google rejects is reported
  # in the log and email. On Google's free tier what is sent may be used to improve its products: to keep your answers
  # (which carry your name and background) off it, give gemini-lite 'role: match' instead of 'match_first: true'.
  match_providers: [groq-20b, groq-qwen, cerebras]
  match_share: 0.6
  providers:
    - {name: groq, base_url: "https://api.groq.com/openai/v1", model: "openai/gpt-oss-120b",
       api_key_env: GROQ_API_KEY, rpm: 25, tpm: 8000, tpd: 195000, extra: {reasoning_effort: low}}
    - {name: groq-20b, base_url: "https://api.groq.com/openai/v1", model: "openai/gpt-oss-20b", match_share: 0.25,
       api_key_env: GROQ_API_KEY, rpm: 25, tpm: 8000, tpd: 195000, extra: {reasoning_effort: low}}
    - {name: groq-qwen, base_url: "https://api.groq.com/openai/v1", model: "qwen/qwen3.8-27b", match_share: 0.25,
       api_key_env: GROQ_API_KEY, rpm: 25, tpm: 6000, tpd: 195000, extra: {reasoning_format: hidden}}
    # Cerebras (free key at cloud.cerebras.ai): about a million tokens a day, so it can carry most of a day's answers
    # and match checks once its key is in the CEREBRAS_API_KEY secret. Idle until then.
    - {name: cerebras, base_url: "https://api.cerebras.ai/v1", model: [gpt-oss-120b, qwen-3-235b-a22b-instruct-2507, llama-3.3-70b],
       match_share: 0.5, api_key_env: CEREBRAS_API_KEY, rpm: 5, tpm: 30000, tpd: 900000, batch: 5}
    # Gemini: new keys (made after mid-2026) only get the 3.x models, so those are named first.
    - {name: gemini-lite, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", match_first: true, match_share: 0.6,
       model: [gemini-3.5-flash-lite, gemini-3.1-flash-lite-preview, gemini-flash-lite-latest], discover: lite,
       api_key_env: GEMINI_API_KEY, rpm: 10, rpd: 480, tpm: 200000, batch: 5, extra: {reasoning_effort: low}}
    - {name: gemini-flash, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", role: match,
       model: [gemini-3.5-flash, gemini-3-flash-preview, gemini-flash-latest], discover: flash,
       api_key_env: GEMINI_API_KEY, rpm: 4, rpd: 18, tpm: 200000, batch: 5, extra: {reasoning_effort: low}}
    # Mistral (free 'Experiment' key at console.mistral.ai, phone check, no card): match checks only, since on the free
    # plan what is sent may be used for training. Idle until the MISTRAL_API_KEY secret exists.
    - {name: mistral, base_url: "https://api.mistral.ai/v1", role: match, model: [mistral-small-latest, mistral-medium-latest],
       api_key_env: MISTRAL_API_KEY, rpm: 20, tpm: 400000, tpd: 3000000, batch: 5}

aggregators:
  jobboard:                 # a public daily snapshot of ~1.4 million open postings on 20,000+ company career sites
    enabled: true
    levels: [entry, mid]    # the snapshot's own level guess. 'mid' is where it puts most coordinator / analyst / associate
                            # postings, so reading only 'entry' missed about 95% of what passes your filters. The bot's own
                            # level rules and the posting's real text still drop anything above early career.
    sites: [Workday, Greenhouse, Lever, BambooHR, Ashby, Paylocity]
    max_age_days: 120       # postings first seen longer ago than this are left out (30 until 2026-10-25: the snapshot
                            # still listed ~2,000 open postings 30-120 days old that fit your titles and places and that the
                            # bot had never seen; a closed one is caught by the employer's own feed before any time is spent)
    max_jobs: 6000          # new candidates taken from one snapshot
  github_lists:             # public GitHub repos that publish new-grad / entry-level postings as JSON
    enabled: true           # false switches the source off
    only_supported_ats: true   # keep only apply links that go straight to a system the bot completes
    repos:
      - {repo: SimplifyJobs/New-Grad-Positions, branch: dev, path: .github/scripts/listings.json}
  builtin:                  # Built In's regional boards: public pages, no login (a blocked page gives no jobs; nothing is done to get around it)
    enabled: true
    regions: [colorado, nyc, la]
    categories: [operations, project-management, data-analytics, finance, consulting]   # (the last three added 2026-10-25)
    pages: 2
  careerjet:                # free API; idle until the CAREERJET_API_KEY secret exists
    enabled: true

facts:                      # answers you gave (2026-10-15), merged into the private facts
  restrictive_agreements: "No"   # no non-compete, non-solicit or other restrictive agreement with any current or past employer
  outside_business: "No"         # not involved in other business activities as a proprietor, partner or officer
  certifications: "None"         # no professional certifications or licenses (a driver's license is asked separately)
  sms_consent: "No"              # (2026-10-27) never agree to be texted: SMS boxes stay unticked, 'may we text you?' -> No,
                                 # 'how should we contact you?' -> email
  # date_of_birth is read from the DATE_OF_BIRTH secret, never written here (this repository is public)

consent:                    # sign-offs the bot may give for you on application forms
  sign_attestations: true   # 'my answers are true and complete', e-signature boxes and their date, privacy / EEO notices
  ai_screening_consent: true   # an employer's own AI screening tool (HiredScore and similar): consent, never opt out
  # arbitration, jury / class-action waivers and dispute-resolution agreements are never agreed to
