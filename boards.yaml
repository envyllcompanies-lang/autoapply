# Public company job boards the bot reads every run. Nothing personal in here (it is committed to the repo, so changing
# this file only needs a git push, not a new secret). The bot merges these lists with any `companies:` in config.yaml.
#
# How to add one: open the company's careers page, click a job, and look at the address.
#   job-boards.greenhouse.io/<token>/jobs/123     -> greenhouse: <token>
#   jobs.lever.co/<token>/<id>                    -> lever: <token>
#   <tenant>.<wdN>.myworkdayjobs.com/<site>/...   -> workday: <tenant>/<wdN>/<site>   (add /Display Name at the end if you like)
#   apply.workable.com/<slug>/                    -> workable: <slug>
#   <slug>.bamboohr.com/careers                   -> bamboohr: <slug>
#   <slug>.recruitee.com                          -> recruitee: <slug>
#   <slug>.breezy.hr                              -> breezy: <slug>
# A token that does not exist is harmless: the run log says "not found" and the bot stops asking after two misses
# (it retries every three weeks). Boards found through the job-board aggregators are added automatically as well.

